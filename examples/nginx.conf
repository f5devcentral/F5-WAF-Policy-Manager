user  nginx;
worker_processes  auto;

load_module modules/ngx_http_app_protect_module.so;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Global F5 WAF for NGINX Settings
    app_protect_enable on;
    app_protect_security_log_enable on;
    app_protect_security_log "/etc/app_protect/conf/log_default.json" /var/log/app_protect/security.log;

    # Upstream application
    upstream backend_app {
        server 127.0.0.1:8080;
    }

    server {
        listen 80;
        server_name example.com;

        # Load WAF policy synchronized from Redis
        # (Exported from F5 WAF Policy Manager)
        app_protect_policy_file "/etc/app_protect/conf/policies/app_protect_default_policy.json";

        location / {
            proxy_pass http://backend_app;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Dedicated API Location with specialized API Security policy
        location /api/ {
            app_protect_policy_file "/etc/app_protect/conf/policies/api_security.json";
            proxy_pass http://backend_app;
        }
    }
}
