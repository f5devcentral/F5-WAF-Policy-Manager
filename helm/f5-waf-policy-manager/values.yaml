# Default values for f5-waf-policy-manager.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

image:
  repository: f5-waf-policy-manager
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: "latest"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Automatically mount a ServiceAccount's API credentials?
  automount: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: false
  runAsNonRoot: false
  # runAsUser: 1000

service:
  type: ClusterIP
  port: 80
  targetPort: 8000
  annotations: {}
  # nodePort: 30080

ingress:
  enabled: false
  className: "nginx"
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # cert-manager.io/cluster-issuer: letsencrypt-prod
  hosts:
    - host: waf-editor.local
      paths:
        - path: /
          pathType: Prefix
  tls: []
  #  - secretName: waf-editor-tls
  #    hosts:
  #      - waf-editor.local

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 128Mi

probes:
  liveness:
    enabled: true
    path: /api/redis/status
    initialDelaySeconds: 15
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3
  readiness:
    enabled: true
    path: /api/redis/status
    initialDelaySeconds: 5
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity: {}

# Application-level configuration
config:
  appDebug: false
  enableMemoryFallback: true
  redisKeyPrefix: ""

# Additional environment variables for the editor container
extraEnv: []
#  - name: CUSTOM_VAR
#    value: "example"

# -----------------------------------------------------------------------------
# Redis Configuration
# -----------------------------------------------------------------------------
redis:
  # When true, a lightweight internal Redis deployment and service are created
  enabled: true
  image:
    repository: redis
    tag: "7-alpine"
    pullPolicy: IfNotPresent
  service:
    port: 6379
    type: ClusterIP
  persistence:
    enabled: true
    size: 1Gi
    storageClass: ""
    accessMode: ReadWriteOnce
  # Optional auth password for internal Redis
  password: ""
  resources:
    limits:
      cpu: 250m
      memory: 256Mi
    requests:
      cpu: 50m
      memory: 64Mi
  # External Redis configuration (used if redis.enabled is false)
  external:
    enabled: false
    host: "my-external-redis.default.svc.cluster.local"
    port: 6379
    db: 0
    ssl: false
    password: ""
    # Reference an existing Secret for Redis password
    existingSecret: ""
    passwordKey: "redis-password"

# -----------------------------------------------------------------------------
# apcompile Service Container / Pod Configuration
# -----------------------------------------------------------------------------
apcompile:
  # When true, a dedicated apcompile compiler deployment and service are created
  enabled: true
  image:
    repository: f5-waf-apcompile
    tag: "latest"
    pullPolicy: IfNotPresent
  service:
    port: 9000
    type: ClusterIP
  resources:
    limits:
      cpu: 1000m
      memory: 1Gi
    requests:
      cpu: 100m
      memory: 256Mi
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    readOnlyRootFilesystem: false
    runAsNonRoot: false

# -----------------------------------------------------------------------------
# ClickHouse Configuration (NGINX Instance Manager Security Monitoring)
# -----------------------------------------------------------------------------
clickhouse:
  host: ""
  port: 8123
  username: "default"
  password: ""
  existingSecret: ""
  passwordKey: "clickhouse-password"
  database: "nms"
  ssl: false
  verifySsl: false


