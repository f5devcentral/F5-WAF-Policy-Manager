{{- if .Values.apcompile.enabled -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "f5-waf-policy-manager.apcompileFullname" . }}
  labels:
    {{- include "f5-waf-policy-manager.apcompileLabels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "f5-waf-policy-manager.apcompileSelectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "f5-waf-policy-manager.apcompileSelectorLabels" . | nindent 8 }}
    spec:
      containers:
        - name: apcompile
          image: "{{ .Values.apcompile.image.repository }}:{{ .Values.apcompile.image.tag }}"
          imagePullPolicy: {{ .Values.apcompile.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.apcompile.service.port }}
              protocol: TCP
          env:
            - name: COMPILER_PORT
              value: "{{ .Values.apcompile.service.port }}"
            - name: WAF_COMPILER_BIN
              value: "/opt/app_protect/bin/apcompile"
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            {{- toYaml .Values.apcompile.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.apcompile.securityContext | nindent 12 }}
{{- end }}
