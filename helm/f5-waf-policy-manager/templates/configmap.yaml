apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "f5-waf-policy-manager.fullname" . }}-config
  labels:
    {{- include "f5-waf-policy-manager.labels" . | nindent 4 }}
data:
  APP_HOST: "0.0.0.0"
  APP_PORT: "{{ .Values.service.targetPort }}"
  APP_DEBUG: "{{ .Values.config.appDebug }}"
  ENABLE_MEMORY_FALLBACK: "{{ .Values.config.enableMemoryFallback }}"
  REDIS_HOST: {{ include "f5-waf-policy-manager.redisHost" . | quote }}
  REDIS_PORT: {{ include "f5-waf-policy-manager.redisPort" . | quote }}
  REDIS_KEY_PREFIX: {{ .Values.config.redisKeyPrefix | quote }}
  {{- if and (not .Values.redis.enabled) .Values.redis.external.enabled }}
  REDIS_DB: {{ .Values.redis.external.db | quote }}
  REDIS_SSL: {{ .Values.redis.external.ssl | quote }}
  {{- else }}
  REDIS_DB: "0"
  REDIS_SSL: "false"
  {{- end }}
  {{- if or .Values.apcompile.enabled .Values.config.compilerServiceUrl }}
  COMPILER_SERVICE_URL: {{ include "f5-waf-policy-manager.compilerServiceUrl" . | quote }}
  {{- end }}


