{{- $needsSecret := false -}}
{{- $password := "" -}}
{{- if and .Values.redis.enabled .Values.redis.password -}}
  {{- $needsSecret = true -}}
  {{- $password = .Values.redis.password -}}
{{- else if and (not .Values.redis.enabled) .Values.redis.external.enabled .Values.redis.external.password (not .Values.redis.external.existingSecret) -}}
  {{- $needsSecret = true -}}
  {{- $password = .Values.redis.external.password -}}
{{- end -}}
{{- if $needsSecret -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "f5-waf-policy-manager.fullname" . }}
  labels:
    {{- include "f5-waf-policy-manager.labels" . | nindent 4 }}
type: Opaque
data:
  redis-password: {{ $password | b64enc | quote }}
{{- end }}
