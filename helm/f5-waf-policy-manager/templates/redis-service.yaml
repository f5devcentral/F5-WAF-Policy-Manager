{{- if .Values.redis.enabled -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "f5-waf-policy-manager.redisFullname" . }}
  labels:
    {{- include "f5-waf-policy-manager.redisLabels" . | nindent 4 }}
spec:
  type: {{ .Values.redis.service.type }}
  ports:
    - port: {{ .Values.redis.service.port }}
      targetPort: redis
      protocol: TCP
      name: redis
  selector:
    {{- include "f5-waf-policy-manager.redisSelectorLabels" . | nindent 4 }}
{{- end }}
